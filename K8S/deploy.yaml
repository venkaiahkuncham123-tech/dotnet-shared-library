apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-app
spec:
  replicas: 1
  strategy:
    type: RollingUpdae
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
      spec:
        containers:
          - name: nginx-container
            image: nginx:latest
            ports:
              - containerPort: 80
            restartPoliy: OnFailure
            imagePullBackPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: argo-svc
spec:
  type: NodePort
  selector:
    app: nginx
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
--- 
apiVersion: v1
kind: ConfigMap
metadata:
  name: argo-cm
data:
  DB_PORT: "3306"
  DB_URL: "jdbc:mysql:128.0.0.0:testdb\svc"
  DB_NAME: "test_db"
